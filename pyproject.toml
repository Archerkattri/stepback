[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stepback"
version = "0.1.0"
description = "git time-travel for any AI coding agent — undo a bad Codex/Claude/aider session in one command."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krishi Attri", email = "krishiattriwork@gmail.com" }]
keywords = [
    "ai", "coding-agent", "checkpoint", "rewind", "undo", "git",
    "claude-code", "codex", "aider", "time-travel", "snapshot", "watchdog",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9,<1.0",
    "watchdog>=3.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/Archerkattri/stepback"
Source = "https://github.com/Archerkattri/stepback"
Issues = "https://github.com/Archerkattri/stepback/issues"
Changelog = "https://github.com/Archerkattri/stepback/blob/master/CHANGELOG.md"

[project.scripts]
stepback = "stepback.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter, not enforced hard
    "B008",   # typer uses function calls in argument defaults by design
    "SIM105", # explicit try/except is clearer than contextlib.suppress here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
